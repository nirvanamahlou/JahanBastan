[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jahan-bastan-backend"
version = "0.1.0"
description = "FastAPI backend for the Jahan Bastan tourism website"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2.0",
  "arabic-reshaper>=3.0,<4.0",
  "cryptography>=50,<51",
  "email-validator>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "fastapi>=0.121,<1.0",
  "httpx>=0.28,<1.0",
  "pillow>=13.0,<14.0",
  "python-bidi>=0.6,<1.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "pydantic-settings>=2.8,<3.0",
  "pwdlib[argon2]>=0.3,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "redis>=6,<7",
  "sentry-sdk[fastapi]>=2,<3",
  "reportlab>=4.2,<5.0",
  "sqlalchemy[asyncio]>=2.0.38,<3.0",
  "structlog>=25.1,<26.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.0,<2.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
